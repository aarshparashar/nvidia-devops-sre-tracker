name: Autonomous NVIDIA SRE Tracker

on:
  schedule:
    - cron: '30 6 * * *' # Runs every day at 06:30 UTC (12:00 PM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Intelligence Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_agent.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/ aggregated/
          if [ -f jobs_table.md ]; then git add jobs_table.md; fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update: NVIDIA DevOps/SRE jobs + skills report ($(date +'%Y-%m-%d'))"
            git push
          fi
